
receivers:
  prometheus:
    config:
      global:
        scrape_interval: 30s
        scrape_timeout: 10s
      scrape_configs:
        - job_name: building-info-service
          metrics_path: /metrics
          static_configs:
            - targets: ['127.0.0.1:8080']
processors:
  resource:
    attributes:
      - action: upsert
        key: cluster
        value: ${GMP_CLUSTER}
      - action: upsert
        key: location
        value: ${GMP_LOCATION}
      - action: upsert
        key: project_id
        value: ${GMP_PROJECT}
  batch:
exporters:
  googlemanagedprometheus:
    project: ${GMP_PROJECT}
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions: [health_check]
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [resource, batch]
      exporters: [googlemanagedprometheus]
