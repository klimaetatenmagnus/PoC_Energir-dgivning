apiVersion: apps/v1
kind: Deployment
metadata:
  name: energiveiledning
  namespace: energiveiledning
  labels:
    app.kubernetes.io/name: energiveiledning
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: energiveiledning
    app.kubernetes.io/managed-by: gitops
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: energiveiledning
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: energiveiledning
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: energiveiledning
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "4000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: building-info
          image: ghcr.io/oslokommune/energiveiledning:{TAG}
          imagePullPolicy: IfNotPresent
          command: ["node", "./dist/backend/building-info-service.mjs"]
          ports:
            - name: http-building
              containerPort: 4000
          envFrom:
            - configMapRef:
                name: energiveiledning-config
            - secretRef:
                name: energiveiledning-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http-building
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http-building
            initialDelaySeconds: 10
            periodSeconds: 20
        - name: api-server
          image: ghcr.io/oslokommune/energiveiledning:{TAG}
          imagePullPolicy: IfNotPresent
          command: ["node", "./dist/backend/api-server.mjs"]
          ports:
            - name: http-api
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: energiveiledning-config
            - secretRef:
                name: energiveiledning-secrets
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /health
              port: http-api
            initialDelaySeconds: 5
            periodSeconds: 10
