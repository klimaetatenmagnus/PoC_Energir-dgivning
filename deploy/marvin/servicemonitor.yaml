apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: energiveiledning
  namespace: energiveiledning
  labels:
    app.kubernetes.io/name: energiveiledning
    release: prometheus
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: energiveiledning
  namespaceSelector:
    matchNames:
      - energiveiledning
  endpoints:
    - port: http-building
      path: /metrics
      interval: 30s
      scheme: http
      honorLabels: false
