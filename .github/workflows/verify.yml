name: Verify

on:
  push:
    branches:
      - main
      - refaktor
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run verification suite
        run: npm run verify
        env:
          MATRIKKEL_USERNAME: dummy
          MATRIKKEL_PASSWORD: dummy

      # Enhetstestene for feilklassifiseringen i adresseoppslaget (404 «ikke
      # funnet» mot 500 driftsfeil). De er rene og trenger verken nett eller
      # data/raw. Resten av tests/unit kjøres ikke her ennå.
      - name: Run address lookup unit tests
        run: >-
          npx vitest run --config vitest.config.backend.ts
          tests/unit/utils/geonorge-adresse.test.ts
          tests/unit/utils/lookup-errors.test.ts
        env:
          MATRIKKEL_USERNAME: dummy
          MATRIKKEL_PASSWORD: dummy
