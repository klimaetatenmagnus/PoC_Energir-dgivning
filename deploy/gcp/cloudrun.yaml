apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: energinokkelen
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "true"
        run.googleapis.com/container-dependencies: '{"api-server":["building-info-service","solar-service"]}'
        autoscaling.knative.dev/minScale: "0"
        autoscaling.knative.dev/maxScale: "4"
    spec:
      serviceAccountName: run-energinokkelen@${PROJECT_ID}.iam.gserviceaccount.com
      containers:
        - name: building-info-service
          image: ${IMAGE_URI}
          command: ["node", "./dist/backend/building-info-service.mjs"]
          ports:
            - name: http1
              containerPort: 4000
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: API_ENV
              value: ${API_ENV}
            - name: PORT
              value: "4000"
            - name: MATRIKKEL_USERNAME
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_USERNAME
                  key: latest
            - name: MATRIKKEL_PASSWORD
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_PASSWORD
                  key: latest
            - name: MATRIKKEL_API_BASE_URL_PROD
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_API_BASE_URL_PROD
                  key: latest
            - name: MATRIKKEL_API_BASE_URL_TEST
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_API_BASE_URL_TEST
                  key: latest
            - name: MATRIKKEL_USERNAME_TEST
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_USERNAME_TEST
                  key: latest
            - name: MATRIKKEL_SNAPSHOT_VERSION
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_SNAPSHOT_VERSION
                  key: latest
            - name: MATRIKKEL_SYSTEM_VERSION
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_SYSTEM_VERSION
                  key: latest
            - name: ENOVA_API_KEY
              valueSource:
                secretKeyRef:
                  name: ENOVA_API_KEY
                  key: latest
            - name: LIVE
              valueSource:
                secretKeyRef:
                  name: LIVE
                  key: latest
        - name: api-server
          image: ${IMAGE_URI}
          command: ["node", "./dist/backend/api-server.mjs"]
          ports:
            - name: http1
              containerPort: 8080
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
          env:
            - name: NODE_ENV
              value: production
            - name: API_ENV
              value: ${API_ENV}
            - name: API_PORT
              value: "8080"
            - name: PORT
              value: "8080"
            - name: BUILDING_INFO_BASE_URL
              value: http://127.0.0.1:4000
            - name: SOLAR_SERVICE_BASE_URL
              value: http://127.0.0.1:4003
            - name: CONTENT_BUCKET
              value: energinokkelen-content
            - name: MATRIKKEL_USERNAME
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_USERNAME
                  key: latest
            - name: MATRIKKEL_PASSWORD
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_PASSWORD
                  key: latest
            - name: MATRIKKEL_API_BASE_URL_PROD
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_API_BASE_URL_PROD
                  key: latest
            - name: MATRIKKEL_API_BASE_URL_TEST
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_API_BASE_URL_TEST
                  key: latest
            - name: MATRIKKEL_USERNAME_TEST
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_USERNAME_TEST
                  key: latest
            - name: MATRIKKEL_SNAPSHOT_VERSION
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_SNAPSHOT_VERSION
                  key: latest
            - name: MATRIKKEL_SYSTEM_VERSION
              valueSource:
                secretKeyRef:
                  name: MATRIKKEL_SYSTEM_VERSION
                  key: latest
            - name: ENOVA_API_KEY
              valueSource:
                secretKeyRef:
                  name: ENOVA_API_KEY
                  key: latest
            - name: LIVE
              valueSource:
                secretKeyRef:
                  name: LIVE
                  key: latest
            - name: PBE_MAP_BASE_URL
              valueSource:
                secretKeyRef:
                  name: PBE_MAP_BASE_URL
                  key: latest
            - name: PBE_IDENTIFY_TOLERANCE
              valueSource:
                secretKeyRef:
                  name: PBE_IDENTIFY_TOLERANCE
                  key: latest
            - name: VITE_API_PROXY_URL
              valueSource:
                secretKeyRef:
                  name: VITE_API_PROXY_URL
                  key: latest
            - name: VITE_BIS_BASE
              valueSource:
                secretKeyRef:
                  name: VITE_BIS_BASE
                  key: latest
        - name: solar-service
          image: ${IMAGE_URI}
          command: ["node", "./services/solar-service/index.js"]
          ports:
            - name: http1
              containerPort: 4003
          resources:
            limits:
              cpu: "0.5"
              memory: 512Mi
          env:
            - name: NODE_ENV
              value: production
            - name: SOLAR_SERVICE_PORT
              value: "4003"
            - name: SOLAR_SERVICE_HOST
              value: "0.0.0.0"
            - name: PBE_MAP_BASE_URL
              valueSource:
                secretKeyRef:
                  name: PBE_MAP_BASE_URL
                  key: latest
            - name: PBE_IDENTIFY_TOLERANCE
              valueSource:
                secretKeyRef:
                  name: PBE_IDENTIFY_TOLERANCE
                  key: latest
  traffic:
    - percent: 100
      latestRevision: true
